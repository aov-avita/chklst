<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Check List Fundaciones · EOS02</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1f2933;--mu:#64707d;--bd:#d8dee4;--ac:#12a594;--ac2:#0d8577;--sl:#475569;--ok:#16a34a;--no:#dc2626;--na:#64748b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181c;--card:#1d2328;--tx:#e6ebef;--mu:#9aa6b2;--bd:#323b43;--ac:#2dd4bf;--ac2:#14b8a6}}
:root[data-theme="dark"]{--bg:#14181c;--card:#1d2328;--tx:#e6ebef;--mu:#9aa6b2;--bd:#323b43;--ac:#2dd4bf;--ac2:#14b8a6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.top{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
.top .lg{background:#fff;border-radius:6px;padding:3px 6px;height:38px}.top .lg img{height:32px;display:block}
.top h1{font-size:15px;margin:0;flex:1;min-width:150px}.top h1 small{display:block;font-weight:400;color:var(--mu);font-size:12px}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 14px}
.btn.p{background:var(--ac);border-color:var(--ac);color:#04221e;font-weight:600}
.btn.s{padding:6px 10px;font-size:13px}
main{max-width:1100px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);margin:0 0 10px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--mu)}
input{font:inherit;width:100%;padding:7px 9px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);margin-top:3px}
input:focus{outline:2px solid var(--ac);outline-offset:-1px}
.row,.hrow{display:grid;grid-template-columns:minmax(150px,1.2fr) 132px minmax(120px,1.4fr) 120px 140px 30px;gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid var(--bd)}
.hrow{font-size:11px;color:var(--mu);text-transform:uppercase;border-bottom:2px solid var(--bd)}
.row input,.sec input{margin:0}
.sec{display:grid;grid-template-columns:1fr 30px;gap:6px;margin-top:10px;padding:6px;background:color-mix(in srgb,var(--ac) 16%,transparent);border-radius:8px}
.sec input{font-weight:700;background:transparent;border-color:transparent;text-transform:uppercase}
.seg{display:flex;gap:4px}.seg button{flex:1;padding:7px 0;border:1px solid var(--bd);background:var(--bg);color:var(--mu);border-radius:6px;font-size:12px;font-weight:600}
.seg .on.SI{background:var(--ok);border-color:var(--ok);color:#fff}.seg .on.NO{background:var(--no);border-color:var(--no);color:#fff}.seg .on.NA{background:var(--na);border-color:var(--na);color:#fff}
.sgbox{margin-top:12px;padding-top:12px;border-top:1px dashed var(--bd)}
.sgbox h3{font-size:12px;margin:0 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.sgbox .g{align-items:start}
.sgbox input[type=checkbox]{width:auto;margin:0 6px 0 0;vertical-align:middle}
.sgbox input[type=file]{padding:5px}
.sgbox input[type=range]{padding:0;border:0;background:transparent}
.sgprev{display:flex;align-items:center;justify-content:center;min-height:90px;background:#fff;border:1px solid var(--bd);border-radius:8px;padding:6px;margin-top:6px}
.sgprev img{max-height:80px;max-width:100%;display:block}
.sgprev.e{color:var(--mu);font-size:12px}
.x{border:0;background:transparent;color:var(--mu);font-size:15px;padding:0}.x:hover{color:var(--no)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
@media(max-width:760px){.hrow{display:none}.row{grid-template-columns:1fr 1fr 30px;padding:8px 0}.row .n,.row .seg,.row .o{grid-column:1/-1}}
#pv{display:none}body.pv #ed{display:none}body.pv #pv{display:block}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.bar span{color:var(--mu);font-size:13px;flex:1}
#zoomer{overflow-x:auto}
.paper{background:#fff;color:#000;width:210mm;padding:8mm;margin:0 auto;box-shadow:0 2px 14px rgba(0,0,0,.25)}
.sheet{width:194mm;font:10px/1.25 Arial,Helvetica,sans-serif;color:#000;background:#fff}
.sheet table{width:100%;border-collapse:collapse;table-layout:fixed}
.sheet td,.sheet th{border:1px solid #000;padding:2px 4px;height:17px;vertical-align:middle;word-break:break-word}
.sheet th{font-weight:700;text-align:left;background:#f1f3f4}
.sheet .hd td{height:auto}.sheet .lg{width:34%;text-align:center;padding:4px}.sheet .lg img{height:44px}
.sheet .t1{text-align:center;font-weight:700;font-size:12px}.sheet .t2{text-align:center;font-weight:700;font-size:13px}
.sheet .cd{width:16%;text-align:center;font-weight:700;font-size:13px}
.sheet .info{margin-top:6px}.sheet .ck{margin-top:6px}
.sheet .ck thead th{text-align:center}.sheet .ck thead th.l{text-align:left}
.sheet .c{text-align:center;font-weight:700}
.sheet tr.s td{background:#dfe5e8;font-weight:700}
.sheet tr{page-break-inside:avoid}
.sheet .na{font-weight:700;margin:5px 0}
.sheet .sg th{width:14%}.sheet .sg td{width:36%}.sheet .sg .fm{height:19mm}.sheet .sg td.fb{padding:1mm 2mm;text-align:center}.sheet .fbox{display:flex;align-items:center;justify-content:center;height:17mm}.sheet .fbox img{display:block;object-fit:contain}.sheet .sg .h{text-align:center;background:#dfe5e8}
@media print{body{background:#fff}.top,#ed,.bar{display:none!important}:root{padding:0}main{padding:0;max-width:none}#pv{display:block!important}#zoomer{zoom:1!important;overflow:visible}.paper{box-shadow:none;padding:0;width:auto}.sheet{width:100%}@page{size:A4;margin:8mm}}
</style>
</head>

const SG0={f:SG.f,t:SG.t};
function prevSg(){[['f','#pFirma','Sin firma'],['t','#pTimbre','Sin timbre']].forEach(([k,id,m])=>{const p=$(id);p.className='sgprev'+(SG[k]?'':' e');p.innerHTML=SG[k]?`<img src="${SG[k]}" alt="">`:m})}
function loadImg(file,key,maxw){if(!file)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,maxw/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);SG[key]=c.toDataURL('image/png');prevSg()};im.onerror=()=>alert('No se pudo leer la imagen.');im.src=r.result};r.readAsDataURL(file)}
function sgInit(){prevSg();
 $('#sgOn').onchange=e=>SG.on=e.target.checked;
 $('#fFirma').onchange=e=>{loadImg(e.target.files[0],'f',600);e.target.value=''};
 $('#fTimbre').onchange=e=>{loadImg(e.target.files[0],'t',400);e.target.value=''};
 $('#szF').oninput=e=>SG.sf=+e.target.value;$('#szT').oninput=e=>SG.st=+e.target.value;$('#ovl').oninput=e=>SG.ov=+e.target.value;
 $('#sgDef').onclick=()=>{SG.f=SG0.f;SG.t=SG0.t;SG.on=true;$('#sgOn').checked=true;prevSg()};
 $('#sgNoF').onclick=()=>{SG.f='';prevSg()};$('#sgNoT').onclick=()=>{SG.t='';prevSg()};}
function sgHtml(){if(!SG.on||(!SG.f&&!SG.t))return '';
 const fh=17*SG.sf/100,th=17*SG.st/100*1.15;
 return `<div class="fbox">${SG.f?`<img src="${SG.f}" alt="" style="height:${fh}mm;max-width:34mm">`:''}${SG.t?`<img src="${SG.t}" alt="" style="height:${th}mm;max-width:34mm;${SG.f?`margin-left:-${SG.ov*0.4}mm;`:''}">`:''}</div>`}
const fld=(a,k,l,t)=>`<label>${l}<input data-h="${k}" type="${t||'text'}" value="${esc(H[k])}"></label>`;
function head(){$('#hf').innerHTML=HF.map(a=>fld(0,a[0],a[1],a[2])).join('');$('#sf').innerHTML=SF.map(a=>fld(0,a[0],a[1],a[2])).join('')}
function rows(){$('#rows').innerHTML=R.map((x,i)=>x.s?
`<div class="sec"><input data-i="${i}" data-k="n" value="${esc(x.n)}" placeholder="Sección"><button class="x" data-del="${i}" title="Eliminar">✕</button></div>`:
`<div class="row"><input class="n" data-i="${i}" data-k="n" value="${esc(x.n)}" placeholder="Partida">
<div class="seg">${['SI','NO','NA'].map(v=>`<button data-i="${i}" data-v="${v}" class="${x.v==v?'on '+v:''}">${v}</button>`).join('')}</div>
<input class="o" data-i="${i}" data-k="o" value="${esc(x.o)}" placeholder="Observaciones">
<input data-i="${i}" data-k="r" value="${esc(x.r)}" placeholder="Responsable">
<input type="date" data-i="${i}" data-k="f" value="${esc(x.f)}">
<button class="x" data-del="${i}" title="Eliminar">✕</button></div>`).join('')}

document.addEventListener('input',e=>{const t=e.target;if(t.dataset.h)H[t.dataset.h]=t.value;else if(t.dataset.i)R[+t.dataset.i][t.dataset.k]=t.value});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.v){const x=R[+d.i];x.v=x.v==d.v?'':d.v;rows()}
 else if(d.del!==undefined){R.splice(+d.del,1);rows()}});
$('#addI').onclick=()=>{R.push({n:'',v:'SI',o:'',r:'',f:hoy});rows();const a=document.querySelectorAll('.row .n');a[a.length-1].focus()};
$('#addS').onclick=()=>{R.push({s:1,n:''});rows();const a=document.querySelectorAll('.sec input');a[a.length-1].focus()};
$('#allSI').onclick=()=>{R.forEach(x=>{if(!x.s)x.v='SI'});rows()};
$('#clr').onclick=()=>{R.forEach(x=>{if(!x.s)x.v=''});rows()};

function sheet(){
 const body=R.map(x=>x.s?`<tr class="s"><td colspan="7">${esc(x.n)}</td></tr>`:
 `<tr><td>${esc(x.n)}</td>${['SI','NO','NA'].map(v=>`<td class="c">${x.v==v?'X':''}</td>`).join('')}<td>${esc(x.o)}</td><td>${esc(x.r)}</td><td class="c">${fd(x.f)}</td></tr>`).join('');
 $('#sheet').innerHTML=`
<table class="hd"><tr><td class="lg" rowspan="2"><img src="${LOGO}" alt=""></td><td class="t1">${esc(H.t1)}</td><td class="cd" rowspan="2">${esc(H.code)}</td></tr><tr><td class="t2">${esc(H.t2)}</td></tr></table>
<table class="info"><colgroup><col style="width:12%"><col style="width:46%"><col style="width:20%"><col style="width:22%"></colgroup>
<tr><th>Obra</th><td>${esc(H.obra)}</td><th>Fecha</th><td>${fd(H.fecha)}</td></tr>
<tr><th>Lote</th><td>${esc(H.lote)}</td><th>Plano referencia</th><td>${esc(H.plano)}</td></tr>
<tr><th>Elemento</th><td colspan="3">${esc(H.elem)}</td></tr></table>
<table class="ck"><colgroup><col style="width:30%"><col style="width:4.5%"><col style="width:4.5%"><col style="width:4.5%"><col style="width:28%"><col style="width:17%"><col style="width:11.5%"></colgroup>
<thead><tr><th class="l" rowspan="2">Partida</th><th colspan="3">CUMPLE</th><th rowspan="2">Observaciones</th><th rowspan="2">Responsable</th><th rowspan="2">Fecha</th></tr><tr><th>SI</th><th>NO</th><th>NA</th></tr></thead>
<tbody>${body}</tbody></table>
<p class="na">N.A = NO APLICABLE</p>
<table class="sg"><tr><th class="h" colspan="2">REALIZADO POR</th><th class="h" colspan="2">CONTROLADO POR</th></tr>
<tr><th>Nombre</th><td>${esc(H.a_n)}</td><th>Nombre</th><td>${esc(H.b_n)}</td></tr>
<tr><th>Cargo</th><td>${esc(H.a_c)}</td><th>Cargo</th><td>${esc(H.b_c)}</td></tr>
<tr><th>Fecha</th><td>${fd(H.a_f)}</td><th>Fecha</th><td>${fd(H.b_f)}</td></tr>
<tr><th class="fm">Firma</th><td class="fb">${sgHtml()}</td><th class="fm">Firma</th><td></td></tr></table>`}

function fit(){const z=$('#zoomer');z.style.zoom=1;const w=z.clientWidth,n=$('.paper').offsetWidth;z.style.zoom=Math.min(1,w/n)}
function show(p){document.body.classList.toggle('pv',p);if(p){sheet();fit();$('#msg').textContent='Revisa el documento antes de generar el PDF.'}window.scrollTo(0,0)}
$('#goPv').onclick=$('#goPv2').onclick=()=>show(true);
$('#back').onclick=()=>show(false);
window.addEventListener('resize',()=>{if(document.body.classList.contains('pv'))fit()});
$('#prn').onclick=()=>{$('#zoomer').style.zoom=1;window.print();fit()};
$('#pdf').onclick=async()=>{
 const z=$('#zoomer'),m=$('#msg');z.style.zoom=1;m.textContent='Generando PDF…';
 const name=`${H.code}_${H.t2.trim().replace(/\s+/g,'_')}_${(H.fecha||H.a_f||'').replace(/-/g,'')}.pdf`;
 try{
  if(!window.html2pdf)throw 0;
  await html2pdf().set({margin:[8,8,8,8],filename:name,image:{type:'jpeg',quality:.98},html2canvas:{scale:2,backgroundColor:'#fff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy'],avoid:'tr'}}).from($('#sheet')).save();
  m.textContent='PDF generado: '+name;
 }catch(err){m.textContent='No se pudo generar el PDF directo. Usa «Imprimir» y elige «Guardar como PDF».'}
 fit();
};
head();rows();sgInit();
</script>
</body>
</html>
